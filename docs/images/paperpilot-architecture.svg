<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">PaperPilot system architecture</title>
  <desc id="desc">Qt desktop client communicates with Drogon C++ backend, which persists to MySQL and invokes the Python Agent Worker. The worker uses GROBID, Qdrant, LLM and Embedding providers, OpenAlex and Tavily MCP tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#16335c" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5b7498"/></marker>
    <style>
      .title{font:700 30px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#14284a}.subtitle{font:400 15px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#58708f}.boxTitle{font:700 21px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#17345d}.body{font:400 15px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#385575}.small{font:400 13px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#58708f}.label{font:600 13px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#496887}.line{stroke:#5b7498;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="820" fill="url(#bg)"/>
  <text x="70" y="66" class="title">PaperPilot · 论文阅读 AI 助手</text>
  <text x="70" y="94" class="subtitle">PDF 解析、向量检索、多 Agent 协作与外部知识增强</text>

  <g filter="url(#shadow)">
    <rect x="70" y="180" width="270" height="238" rx="18" fill="#ffffff" stroke="#8db8ff" stroke-width="2"/>
    <rect x="435" y="145" width="326" height="310" rx="18" fill="#ffffff" stroke="#75a7f4" stroke-width="2"/>
    <rect x="856" y="145" width="400" height="310" rx="18" fill="#ffffff" stroke="#8cc8b4" stroke-width="2"/>
    <rect x="435" y="650" width="326" height="125" rx="18" fill="#ffffff" stroke="#efb774" stroke-width="2"/>
  </g>

  <text x="104" y="224" class="boxTitle">Qt 6 桌面客户端</text>
  <text x="104" y="258" class="body">· 登录与论文库</text><text x="104" y="287" class="body">· PDF 导入 / 任务进度</text><text x="104" y="316" class="body">· 多模式 AI 对话</text><text x="104" y="345" class="body">· 笔记与外部来源展示</text>
  <text x="104" y="390" class="small">desktop/ · Widgets + Network</text>

  <text x="468" y="189" class="boxTitle">Drogon C++ 后端</text>
  <text x="468" y="223" class="body">· 鉴权、论文 / 笔记接口</text><text x="468" y="252" class="body">· PDF 解析与索引任务编排</text><text x="468" y="281" class="body">· 会话历史与消息持久化</text><text x="468" y="310" class="body">· 转发 Python Worker 请求</text>
  <text x="468" y="361" class="small">server/ · HTTP JSON · :8848</text>

  <text x="889" y="189" class="boxTitle">Python Agent Worker</text>
  <text x="889" y="223" class="body">· GROBID PDF 结构化解析</text><text x="889" y="252" class="body">· Embedding + Qdrant 语义检索</text><text x="889" y="281" class="body">· LangGraph：Coordinator → Researchers → Writer</text><text x="889" y="310" class="body">· 引用编号校验与结构化响应</text>
  <text x="889" y="361" class="small">agent_worker/ · FastAPI · :8001</text>

  <text x="468" y="693" class="boxTitle">MySQL 8</text>
  <text x="468" y="723" class="body">papers · paper_chunks · ai_tasks</text><text x="468" y="751" class="body">paper_chat_sessions · messages</text>

  <path d="M340 299 H435" class="line"/><text x="357" y="281" class="label">HTTP / JSON</text>
  <path d="M761 299 H856" class="line"/><text x="780" y="281" class="label">内部 HTTP</text>
  <path d="M598 455 V650" class="line"/><text x="612" y="550" class="label">持久化</text>

  <g filter="url(#shadow)">
    <rect x="70" y="520" width="220" height="108" rx="16" fill="#fff" stroke="#aa91e8" stroke-width="2"/>
    <rect x="310" y="520" width="220" height="108" rx="16" fill="#fff" stroke="#76b6e8" stroke-width="2"/>
    <rect x="856" y="520" width="185" height="108" rx="16" fill="#fff" stroke="#7ac2a6" stroke-width="2"/>
    <rect x="1071" y="520" width="185" height="108" rx="16" fill="#fff" stroke="#f0a770" stroke-width="2"/>
    <rect x="856" y="675" width="185" height="108" rx="16" fill="#fff" stroke="#e69ab2" stroke-width="2"/>
    <rect x="1071" y="675" width="185" height="108" rx="16" fill="#fff" stroke="#9caeea" stroke-width="2"/>
  </g>
  <text x="100" y="560" class="boxTitle">GROBID</text><text x="100" y="590" class="small">TEI XML · PDF 解析</text>
  <text x="340" y="560" class="boxTitle">Qdrant</text><text x="340" y="590" class="small">论文块向量检索</text>
  <text x="884" y="560" class="boxTitle">LLM</text><text x="884" y="590" class="small">回答生成</text>
  <text x="1099" y="560" class="boxTitle">Embedding</text><text x="1099" y="590" class="small">文本向量化</text>
  <text x="884" y="715" class="boxTitle">OpenAlex MCP</text><text x="884" y="745" class="small">学术文献检索</text>
  <text x="1099" y="715" class="boxTitle">Tavily MCP</text><text x="1099" y="745" class="small">网络网页检索</text>

  <!-- Worker dependencies use orthogonal paths outside component cards. -->
  <path d="M990 455 V520" class="line"/>
  <path d="M1136 455 V520" class="line"/>
  <path d="M856 390 H800 V475 H180 V520" class="line"/>
  <path d="M856 425 H780 V500 H420 V520" class="line"/>
  <path d="M856 405 H800 V650 H948 V675" class="line"/>
  <path d="M1256 405 H1290 V650 H1163 V675" class="line"/>
  <text x="72" y="145" class="subtitle">核心职责边界：Drogon 负责业务与 MySQL；Worker 负责解析、检索与 Agent。</text>
</svg>
